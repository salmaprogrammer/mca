# nginx site config (sprint S10.2).
#
# TLS termination and static files here; everything else proxies to gunicorn.
# Certificates via certbot: sudo certbot --nginx -d mca.example.com

server {
    listen 80;
    server_name mca.example.com;
    # ACME challenges must stay on http; everything else goes to https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mca.example.com;

    ssl_certificate     /etc/letsencrypt/live/mca.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mca.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Course cover images are the only uploads; 5M is generous for a photo.
    client_max_body_size 5M;

    # Serve static assets directly. They are all vendored, so they can be
    # cached hard — but never the .mo files or anything under instance/.
    location /static/ {
        alias /srv/mca/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        # The app reads the client IP for the login throttle and the audit log;
        # without these it would throttle and log the proxy instead of the user.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # The app sets its own CSP and other security headers; nginx must not add a
    # second, conflicting set.
}
